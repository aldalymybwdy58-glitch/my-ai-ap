<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار الذكاء الاصطناعي</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #212121;
      color: white;
      padding: 20px;
    }.box {
  max-width: 600px;
  margin: 40px auto;
  background: #2f2f2f;
  padding: 20px;
  border-radius: 16px;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #10a37f;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

pre {
  margin-top: 20px;
  padding: 15px;
  background: #111;
  border-radius: 10px;
  white-space: pre-wrap;
  word-break: break-word;
  direction: ltr;
  text-align: left;
}

  </style>
</head><body>
  <div class="box">
    <h2>اختبار Chat AI</h2>
    <p>سيتم إرسال: <b>مرحبا</b></p><button onclick="testChat()">
  اختبار الاتصال
</button>

<pre id="result">لم يبدأ الاختبار بعد...</pre>

  </div><script>
async function testChat() {
  const result = document.getElementById("result");

  result.textContent = "جاري إرسال الطلب...";

  try {
    const response = await fetch(
      "https://my-ai-ap.aldalymybwdy58.workers.dev/api/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: "مرحبا",
          history: []
        })
      }
    );

    const text = await response.text();

    let output;

    try {
      output = JSON.stringify(JSON.parse(text), null, 2);
    } catch {
      output = text;
    }

    result.textContent =
      "HTTP STATUS: " + response.status +
      "\n\n" +
      output;

  } catch (error) {
    result.textContent =
      "فشل الاتصال بالطلب نفسه:\n\n" +
      "الاسم: " + error.name +
      "\n\n" +
      "الرسالة: " + error.message;
  }
}
</script></body>
</html>
