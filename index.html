<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الذكاء الاصطناعي الخاص بي</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 12px;
      min-height: 60px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 تطبيق الذكاء الاصطناعي الخاص بي</h1>
</header>

<main>
  <div class="box">
    <h2>مرحبًا بك 👋</h2>
    <p>اكتب سؤالك في الأسفل:</p>

    <textarea id="question" placeholder="اكتب سؤالك هنا..."></textarea>

    <button onclick="sendQuestion()">إرسال</button>

    <div id="result">ستظهر الإجابة هنا...</div>
  </div>
</main>

<script>
async function sendQuestion() {
  const question = document.getElementById("question").value.trim();
  const result = document.getElementById("result");

  if (!question) {
    result.textContent = "اكتب سؤالًا أولًا.";
    return;
  }

  result.textContent = "جارٍ التفكير...";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: question
      })
    });

    const data = await response.json();

    if (data.reply) {
      result.textContent = data.reply;
    } else {
      result.textContent = "لم تصل إجابة من الخادم.";
    }

  } catch (error) {
    result.textContent = "حدث خطأ في الاتصال بالخادم.";
  }
}
</script>

</body>
</html>
