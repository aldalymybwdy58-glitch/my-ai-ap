<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعدي الذكي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      height: 100vh;
    }

    .app {
      height: 100vh;
      max-width: 800px;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 80px;
      color: #555;
    }

    .message {
      max-width: 85%;
      margin: 12px 0;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .user {
      background: #e5e7eb;
      margin-right: auto;
    }

    .assistant {
      background: #111827;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    textarea {
      flex: 1;
      height: 52px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>
