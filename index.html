<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعدي الذكي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;height:100vh}
.app{height:100vh;max-width:800px;margin:auto;background:white;display:flex;flex-direction:column}
header{background:#111827;color:white;padding:18px;text-align:center;font-size:22px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:20px}
.welcome{text-align:center;margin-top:80px;color:#555}
.message{max-width:85%;margin:12px 0;padding:13px 16px;border-radius:15px;line-height:1.6;white-space:pre-wrap}
.user{background:#e5e7eb;margin-right:auto}
.assistant{background:#111827;color:white;margin-left:auto}
.input-area{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}
textarea{flex:1;height:52px;resize:none;border:1px solid #ccc;border-radius:14px;padding:14px;font-size:16px;outline:none}
button{border:0;border-radius:14px;padding:0 20px;background:#111827;color:white;font-size:16px}
button:disabled{opacity:.5}
</style>
</head>
<body>

<div class="app">
<header>🤖 مساعدي الذكي</header>

<div id="chat">
<div class="welcome">
<h2>مرحبًا بك 👋</h2>
<p>أنا مساعدك الذكي</p>
<p>اكتب رسالتك في الأسفل للبدء.</p>
</div>
</div>

<div class="input-area">
<textarea id="message" placeholder="اكتب رسالتك هنا..."></textarea>
<button id="send">إرسال</button>
</div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const button=document.getElementById("send");

function addMessage(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
const question=input.value.trim();
if(!question)return;

addMessage(question,"user");
input.value="";
button.disabled=true;

try{
const response=await fetch("https://my-ai-ap.aldalymybwdy58.workers.dev/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:question})
});

const data=await response.json();
addMessage(data.reply||"لم تصل إجابة.","assistant");

}catch(error){
addMessage("حدث خطأ في الاتصال بالخادم.","assistant");
}

button.disabled=false;
input.focus();
}

button.addEventListener("click",sendMessage);

input.addEventListener("keydown",function(event){
if(event.key==="Enter"&&!event.shiftKey){
event.preventDefault();
sendMessage();
}
});
</script>

</body>
</html>
