<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعدي الذكي</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    .app {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #777;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .ai {
      background: white;
      border: 1px solid #e2e2e2;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .welcome {
      text-align: center;
      margin-top: 25vh;
      color: #666;
    }

    .welcome h2 {
      color: #222;
    }

    .input-area {
      background: white;
      padding: 12px;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 8px;
      position: sticky;
      bottom: 0;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 50px;
      max-height: 130px;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #ef4444;
      padding: 10px 15px;
      margin: 10px auto;
      display: block;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🤖 مساعدي الذكي</h1>
    <p>اسألني أي شيء</p>
  </header>

  <div id="chat">

    <div class="welcome" id="welcome">
      <h2>مرحباً بك 👋</h2>
      <p>اكتب سؤالك في الأسفل للبدء.</p>
    </div>

  </div>

  <button class="clear" onclick="clearChat()">١
  ١ض
