<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعدي الذكي</title>  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    .app {
      max-width: 700px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      color: #777;
      margin: 8px 0 0;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 25vh;
      color: #777;
    }

    .welcome h2 {
      color: #222;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .ai {
      background: white;
      border: 1px solid #ddd;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
      position: sticky;
      bottom: 0;
    }

    textarea {
      flex: 1;
      min-height: 50px;
      max-height: 130px;
      resize: none;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .clear {
      background: #ef4444;
      padding: 10px 16px;
      margin: 10px auto;
    }
  </style></head><body>  <div class="app"><header>
  <h1>🤖 مساعدي الذكي</h1>
  <p>اسألني أي شيء</p>
</header>

<div id="chat">

  <div class="welcome" id="welcome">
    <h2>مرحباً بك 👋</h2>
    <p>اكتب سؤالك في الأسفل للبدء.</p>
  </div>

</div>

<button class="clear" onclick="clearChat()">مسح المحادثة</button>

<div class="input-area">

  <textarea
    id="message"
    placeholder="اكتب رسالتك هنا..."
    onkeydown="handleKey(event)"
  ></textarea>

  <button onclick="sendMessage()">إرسال</button>

</div>

  </div>  <script>

    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const welcome = document.getElementById("welcome");

    function addMessage(text, type) {

      welcome.style.display = "none";

      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {

      const text = input.value.trim();

      if (!text) {
        return;
      }

      addMessage(text, "user");

      input.value = "";

      setTimeout(function() {

        const reply =
          "مرحباً! 🤖\n\n" +
          "هذه نسخة تجريبية من مساعدي الذكي.\n" +
          "وصلتني رسالتك:\n" +
          text;

        addMessage(reply, "ai");

      }, 600);
    }

    function handleKey(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
      }
    }

    function clearChat() {

      document.querySelectorAll(".message").forEach(function(message) {
        message.remove();
      });

      welcome.style.display = "block";
    }

  </script></body>
</html>
