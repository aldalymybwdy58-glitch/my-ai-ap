<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<meta
  name="description"
  content="مساعد الذكاء الاصطناعي — منصة ذكاء اصطناعي عربية متطورة"
>

<meta name="theme-color" content="#07080d">

<meta name="color-scheme" content="dark">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<meta
  name="apple-mobile-web-app-title"
  content="مساعد الذكاء الاصطناعي"
>

<title>مساعد الذكاء الاصطناعي</title>

<link rel="manifest" href="/manifest.webmanifest">

<link rel="icon" href="/icon-192.png">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{

  --bg:
    #06070b;

  --bg-soft:
    #0b0d13;

  --bg-panel:
    rgba(17,20,29,.88);

  --bg-panel-2:
    rgba(22,25,35,.92);

  --bg-hover:
    rgba(255,255,255,.055);

  --text:
    #f8fafc;

  --text-soft:
    #d7dbe5;

  --muted:
    #9299a8;

  --muted-2:
    #666d7c;

  --border:
    rgba(255,255,255,.075);

  --border-strong:
    rgba(255,255,255,.14);

  --purple:
    #8b5cf6;

  --purple-2:
    #7c3aed;

  --indigo:
    #6366f1;

  --blue:
    #3b82f6;

  --cyan:
    #22d3ee;

  --green:
    #34d399;

  --red:
    #fb7185;

  --yellow:
    #fbbf24;

  --radius-xs:
    9px;

  --radius-sm:
    13px;

  --radius:
    18px;

  --radius-lg:
    25px;

  --radius-xl:
    32px;

  --shadow:
    0 30px 100px rgba(0,0,0,.55);

  --shadow-soft:
    0 15px 45px rgba(0,0,0,.28);

  --sidebar-width:
    305px;

  --topbar-height:
    70px;

  --composer-height:
    100px;

  --transition:
    .22s cubic-bezier(.2,.8,.2,1);

}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  width:100%;
  height:100%;
  scroll-behavior:smooth;
}

body{
  width:100%;
  height:100%;
  overflow:hidden;

  color:var(--text);

  background:

    radial-gradient(
      circle at 90% -10%,
      rgba(99,102,241,.18),
      transparent 32%
    ),

    radial-gradient(
      circle at 0% 100%,
      rgba(139,92,246,.11),
      transparent 35%
    ),

    var(--bg);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  outline:2px solid rgba(139,92,246,.7);
  outline-offset:2px;
}

img{
  max-width:100%;
}

.hidden{
  display:none!important;
}

.no-scroll{
  overflow:hidden!important;
}


/* =========================================================
   SCROLLBARS
========================================================= */

*{
  scrollbar-width:thin;
  scrollbar-color:
    rgba(255,255,255,.12)
    transparent;
}

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.11);
  border-radius:99px;
}

::-webkit-scrollbar-thumb:hover{
  background:rgba(255,255,255,.18);
}


/* =========================================================
   APP SHELL
========================================================= */

.app{
  position:relative;

  width:100%;
  height:100%;

  display:flex;

  overflow:hidden;
}


/* =========================================================
   BACKGROUND EFFECTS
========================================================= */

.background-effects{
  position:fixed;
  inset:0;

  pointer-events:none;

  overflow:hidden;

  z-index:0;
}

.background-effects::before{
  content:"";

  position:absolute;

  width:500px;
  height:500px;

  top:-260px;
  right:-180px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(99,102,241,.14),
      transparent 70%
    );

  filter:blur(20px);
}

.background-effects::after{
  content:"";

  position:absolute;

  width:450px;
  height:450px;

  bottom:-250px;
  left:-180px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(139,92,246,.11),
      transparent 70%
    );

  filter:blur(20px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:relative;

  width:var(--sidebar-width);
  height:100%;

  flex:none;

  display:flex;
  flex-direction:column;

  padding:17px;

  border-left:1px solid var(--border);

  background:
    linear-gradient(
      180deg,
      rgba(16,18,26,.96),
      rgba(7,8,12,.98)
    );

  backdrop-filter:
    blur(30px);

  -webkit-backdrop-filter:
    blur(30px);

  z-index:50;

  transition:
    transform var(--transition),
    right var(--transition);
}


/* =========================================================
   BRAND
========================================================= */

.brand{
  display:flex;
  align-items:center;

  gap:12px;

  min-height:55px;

  padding:
    4px
    5px
    16px;
}

.brand-logo{
  position:relative;

  width:47px;
  height:47px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:16px;

  color:#fff;

  font-size:15px;
  font-weight:950;

  background:
    linear-gradient(
      135deg,
      #a78bfa 0%,
      #7c3aed 42%,
      #4f46e5 75%,
      #06b6d4 100%
    );

  box-shadow:
    0 0 30px rgba(99,102,241,.3),
    inset 0 1px 1px rgba(255,255,255,.3);

  overflow:hidden;
}

.brand-logo::before{
  content:"";

  position:absolute;

  width:22px;
  height:22px;

  top:5px;
  left:7px;

  border-radius:50%;

  background:
    rgba(255,255,255,.28);

  filter:blur(6px);
}

.brand-logo span{
  position:relative;
  z-index:2;
}

.brand-info{
  min-width:0;
}

.brand-info strong{
  display:block;

  color:#fff;

  font-size:14px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand-info small{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:10px;

  white-space:nowrap;
}


/* =========================================================
   NEW CHAT
========================================================= */

.new-chat{
  position:relative;

  width:100%;
  height:51px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  margin-bottom:14px;

  border-radius:16px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #6366f1
    );

  font-weight:850;
  font-size:13px;

  cursor:pointer;

  box-shadow:
    0 12px 35px rgba(99,102,241,.22);

  overflow:hidden;

  transition:
    transform var(--transition),
    box-shadow var(--transition);
}

.new-chat::before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent,
      rgba(255,255,255,.16),
      transparent
    );

  transform:translateX(-120%);

  transition:.6s;
}

.new-chat:hover::before{
  transform:translateX(120%);
}

.new-chat:hover{
  transform:translateY(-2px);

  box-shadow:
    0 17px 45px rgba(99,102,241,.32);
}

.new-chat:active{
  transform:translateY(0);
}

.new-chat-icon{
  font-size:20px;
  line-height:1;
}


/* =========================================================
   SIDEBAR NAV
========================================================= */

.sidebar-section{
  margin-bottom:12px;
}

.sidebar-label{
  padding:
    4px
    9px
    7px;

  color:var(--muted-2);

  font-size:10px;
  font-weight:800;
}

.sidebar-nav{
  display:flex;
  flex-direction:column;

  gap:4px;
}

.nav-item{
  position:relative;

  width:100%;
  min-height:45px;

  display:flex;
  align-items:center;

  gap:11px;

  padding:
    0
    12px;

  border-radius:14px;

  color:#b8becb;

  background:transparent;

  text-align:right;

  cursor:pointer;

  transition:
    background var(--transition),
    color var(--transition),
    transform var(--transition);
}

.nav-item:hover{
  color:#fff;
  background:rgba(255,255,255,.045);
}

.nav-item.active{
  color:#fff;

  background:
    linear-gradient(
      90deg,
      rgba(124,58,237,.19),
      rgba(99,102,241,.07)
    );
}

.nav-item.active::before{
  content:"";

  position:absolute;

  right:0;

  width:3px;
  height:20px;

  border-radius:99px;

  background:
    linear-gradient(
      180deg,
      #a78bfa,
      #6366f1
    );

  box-shadow:
    0 0 12px rgba(139,92,246,.6);
}

.nav-icon{
  width:25px;

  flex:none;

  display:grid;
  place-items:center;

  font-size:18px;
}

.nav-text{
  flex:1;

  font-size:12px;
  font-weight:650;
}

.nav-badge{
  min-width:20px;
  height:20px;

  display:grid;
  place-items:center;

  padding:0 6px;

  border-radius:99px;

  color:#fff;

  background:
    rgba(139,92,246,.28);

  font-size:9px;
}


/* =========================================================
   SIDEBAR HISTORY
========================================================= */

.history-area{
  flex:1;

  min-height:0;

  display:flex;
  flex-direction:column;

  margin-top:4px;
}

.history-title-row{
  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:
    5px
    8px
    8px;
}

.history-title{
  color:var(--muted-2);

  font-size:10px;
  font-weight:800;
}

.history-search{
  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  border-radius:9px;

  color:var(--muted);

  background:transparent;

  cursor:pointer;
}

.history-search:hover{
  color:#fff;
  background:rgba(255,255,255,.05);
}

.history-list{
  flex:1;

  min-height:0;

  overflow:auto;

  padding-left:2px;
}

.history-empty{
  padding:
    30px
    12px;

  color:var(--muted-2);

  text-align:center;

  font-size:10px;

  line-height:1.8;
}

.history-item{
  width:100%;

  min-height:43px;

  display:flex;
  align-items:center;

  gap:8px;

  margin-bottom:3px;

  padding:
    8px
    9px;

  border-radius:12px;

  color:#aeb4c0;

  background:transparent;

  cursor:pointer;

  text-align:right;

  transition:.2s;
}

.history-item:hover{
  color:#fff;

  background:
    rgba(255,255,255,.045);
}

.history-item.active{
  color:#fff;

  background:
    rgba(255,255,255,.065);
}

.history-item-icon{
  width:25px;

  flex:none;

  color:#777f8f;

  text-align:center;
}

.history-item-text{
  flex:1;

  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:11px;
}

.history-item-menu{
  width:25px;
  height:25px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:8px;

  color:var(--muted);

  background:transparent;

  opacity:0;

  cursor:pointer;
}

.history-item:hover .history-item-menu{
  opacity:1;
}

.history-item-menu:hover{
  color:#fff;
  background:rgba(255,255,255,.07);
}


/* =========================================================
   USER CARD
========================================================= */

.user-card{
  display:flex;
  align-items:center;

  gap:10px;

  min-height:63px;

  margin-top:12px;

  padding:
    10px;

  border:
    1px solid var(--border);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.018)
    );
}

.user-avatar{
  width:39px;
  height:39px;

  flex:none;

  display:grid;
  place-items:center;

  border-radius:13px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #272b39,
      #11141c
    );

  border:
    1px solid var(--border-strong);

  font-size:17px;
}

.user-details{
  flex:1;

  min-width:0;
}

.user-details strong{
  display:block;

  color:#fff;

  font-size:11px;
}

.user-details span{
  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:9px;
}

.user-more{
  width:30px;
  height:30px;

  display:grid;
  place-items:center;

  border-radius:10px;

  color:var(--muted);

  background:transparent;

  cursor:pointer;
}

.user-more:hover{
  color:#fff;
  background:rgba(255,255,255,.06);
}


/* =========================================================
   MAIN
========================================================= */

.main{
