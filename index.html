<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#fff;
  color:#171717;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
}

/* القائمة الجانبية */
.sidebar{
  width:280px;
  height:100%;
  background:#f7f7f8;
  border-left:1px solid #e5e5e5;
  padding:12px;
  display:flex;
  flex-direction:column;
  transition:.25s;
}

.new-chat{
  width:100%;
  height:48px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  cursor:pointer;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
}

.new-chat:hover{
  background:#f0f0f0;
}

.history{
  margin-top:20px;
  flex:1;
  overflow-y:auto;
}

.history-title{
  color:#777;
  font-size:13px;
  padding:10px;
}

.history-item{
  padding:11px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#e9e9e9;
}

/* المنطقة الرئيسية */
.main{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #eee;
  background:#fff;
}

.menu-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  border-radius:8px;
  font-size:24px;
  cursor:pointer;
}

.menu-btn:hover{
  background:#f2f2f2;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:25px 16px 150px;
}

.chat-inner{
  width:100%;
  max-width:800px;
  margin:auto;
}

/* الرسائل */
.message{
  display:flex;
  gap:12px;
  margin:25px 0;
  line-height:1.8;
  font-size:16px;
}

.avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
}

.assistant .avatar{
  background:#111;
  color:#fff;
}

.user .avatar{
  background:#e5e5e5;
  color:#222;
}

.text{
  flex:1;
  white-space:pre-wrap;
  word-break:break-word;
}

/* شاشة البداية بدون ترحيب */
.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#555;
  font-size:15px;
}

/* صندوق الكتابة */
.bottom{
  position:fixed;
  bottom:0;
  right:280px;
  left:0;
  background:linear-gradient(
    transparent,
    #fff 25%
  );
  padding:30px 16px 18px;
}

.composer{
  max-width:800px;
  margin:auto;
  border:1px solid #d9d9d9;
  border-radius:25px;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  display:flex;
  align-items:flex-end;
  padding:7px;
}

textarea{
  flex:1;
  border:0;
  outline:0;
  resize:none;
  font-family:Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  padding:10px;
  min-height:44px;
  max-height:130px;
  background:transparent;
}

.action{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:transparent;
  cursor:pointer;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.action:hover{
  background:#eee;
}

.send{
  background:#111;
  color:#fff;
}

.send:hover{
  background:#333;
}

.attach{
  font-size:22px;
}

/* الهاتف */
@media(max-width:700px){

  .sidebar{
    position:fixed;
    right:0;
    top:0;
    z-index:20;
    transform:translateX(100%);
    box-shadow:-5px 0 20px rgba(0,0,0,.12);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .bottom{
    right:0;
  }

  .chat{
    padding-left:12px;
    padding-right:12px;
  }

  .message{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <button class="new-chat" onclick="newChat()">
      ＋
      <span>محادثة جديدة</span>
    </button>

    <div class="history">
      <div class="history-title">المحادثات</div>
      <div id="historyList"></div>
    </div>

  </aside>

  <main class="main">

    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <section class="chat" id="chat">
      <div class="chat-inner" id="messages">

        <div class="empty" id="empty">
          ابدأ محادثة جديدة
        </div>

      </div>
    </section>

  </main>

  <div class="bottom">

    <div class="composer">

      <button class="action attach" title="إرفاق ملف" onclick="attachFile()">
        📎
      </button>

      <textarea
        id="input"
        placeholder="اكتب رسالتك..."
        rows="1"
        oninput="resizeInput(this)"
        onkeydown="handleKey(event)"
      ></textarea>

      <button class="action" title="الصوت" onclick="startVoice()">
        🎙️
      </button>

      <button class="action send" title="إرسال" onclick="sendMessage()">
        ↑
      </button>

    </div>

  </div>

</div>

<input
  type="file"
  id="fileInput"
  style="display:none"
  onchange="fileSelected(this)"
>

<script>

let conversations = [];
let currentMessages = [];

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function newChat(){

  currentMessages = [];

  document.getElementById("messages").innerHTML =
    '<div class="empty" id="empty">ابدأ محادثة جديدة</div>';

  document.getElementById("input").value = "";

  document.getElementById("sidebar").classList.remove("open");
}

function resizeInput(el){

  el.style.height = "auto";

  el.style.height =
    Math.min(el.scrollHeight,130) + "px";
}

function handleKey(event){

  if(event.key === "Enter" && !event.shiftKey){

    event.preventDefault();

    sendMessage();
  }
}

function addMessage(text,type){

  const empty = document.getElementById("empty");

  if(empty){
    empty.remove();
  }

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    type === "user" ? "أنت" : "AI";

  const content =
    document.createElement("div");

  content.className = "text";

  content.textContent = text;

  message.appendChild(avatar);
  message.appendChild(content);

  document.getElementById("messages")
    .appendChild(message);

  const chat =
    document.getElementById("chat");

  chat.scrollTop = chat.scrollHeight;
}

function sendMessage(){

  const input =
    document.getElementById("input");

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  currentMessages.push({
    role:"user",
    content:text
  });

  input.value = "";
  input.style.height = "44px";

  /*
    هنا سنربط API الذكاء الاصطناعي
    الموجود في مشروعك.
  */

  setTimeout(() => {

    addMessage(
      "تم استلام رسالتك. سيتم ربط الذكاء الاصطناعي هنا.",
      "assistant"
    );

  },500);
}

function attachFile(){

  document.getElementById("fileInput").click();
}

function fileSelected(input){

  if(!input.files.length) return;

  const file =
    input.files[0];

  addMessage(
    "تم إرفاق الملف: " + file.name,
    "user"
  );

  input.value = "";
}

function startVoice(){

  if(!("webkitSpeechRecognition" in window) &&
     !("SpeechRecognition" in window)){

    alert("التعرف على الصوت غير مدعوم في هذا المتصفح.");
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const recognition =
    new SpeechRecognition();

  recognition.lang = "ar-SA";
  recognition.interimResults = false;

  recognition.onresult = function(event){

    document.getElementById("input").value =
      event.results[0][0].transcript;

  };

  recognition.start();
}

</script>

</body>
</html>
