<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 مساعدي الذكي</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb}
.app{max-width:700px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;background:white;padding:20px}
#chat{flex:1;padding:15px}
.message{padding:12px;margin:10px 0;border-radius:15px;white-space:pre-wrap}
.ai{background:white}
.user{background:#2563eb;color:white}
.input{display:flex;gap:8px;padding:12px;background:white}
textarea{flex:1;padding:12px;font-size:16px;border-radius:12px;border:1px solid #ccc}
button{padding:12px 18px;border:0;border-radius:12px;background:#2563eb;color:white}
</style>
</head>

<body>
<div class="app">

<header>
<h1>🤖 مساعدي الذكي</h1>
<p>اسألني أي شيء</p>
</header>

<div id="chat">
<div class="message ai">مرحبًا 👋 اكتب رسالتك وسأجيبك.</div>
</div>

<div class="input">
<textarea id="message" placeholder="اكتب هنا..."></textarea>
<button id="send">إرسال</button>
</div>

</div>

<script>
const input=document.getElementById("message");
const chat=document.getElementById("chat");
const send=document.getElementById("send");

function addMessage(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}

function sendMessage(){
  const text=input.value.trim();
  if(!text)return;

  addMessage(text,"user");
  input.value="";

  setTimeout(function(){
    let reply 

    if(text.incl""))  reply="
if(text.includes("السلام عليكم") || text.includes("سلام عليكم"))
    if(text.includes("من انت") || text.includes("من أنت"))
      reply="أنا مساعدي الذكي 🤖.";

    addMessage(reply,"ai");
  },300);
}

send.addEventListener("click",sendMessage);

input.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
