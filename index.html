<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#212121">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>ومنظومة بلا حدود</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  font-family:Arial,"Noto Sans Arabic",sans-serif;
  background:#212121;color:#fff
}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

.login-screen{
 position:fixed;inset:0;z-index:9999;
 display:flex;align-items:center;justify-content:center;
 padding:20px;
 background:radial-gradient(circle at 50% 20%,#383838,#212121 45%,#111)
}
.login-box{width:100%;max-width:400px;text-align:center}
.logo{
 width:78px;height:78px;margin:0 auto 20px;
 border-radius:24px;
 background:linear-gradient(145deg,#fff,#ccc);
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 15px 40px #0008,inset 0 1px #fff;
 position:relative
}
.logo:before{
 content:"";width:38px;height:38px;border:5px solid #111;
 border-radius:50%;position:absolute
}
.logo:after{
 content:"✦";color:#111;font-size:27px;font-weight:bold
}
.login-box h1{margin:0 0 8px;font-size:27px}
.login-box p{color:#aaa;margin:0 0 25px}
.login-card{
 background:#2b2b2bf2;border:1px solid #444;
 border-radius:22px;padding:20px;text-align:right;
 box-shadow:0 20px 60px #0006
}
.login-card label{display:block;color:#bbb;font-size:13px;margin:12px 0 7px}
.login-card input{
 width:100%;height:48px;border:1px solid #4b4b4b;
 border-radius:13px;outline:0;background:#212121;color:#fff;
 padding:0 13px
}
.login-btn{
 width:100%;height:48px;margin-top:18px;border:0;
 border-radius:13px;background:#fff;color:#111;font-weight:bold
}
.login-note{text-align:center;color:#777;font-size:11px;margin-top:15px}

.app{
 height:100vh;height:100dvh;display:flex;background:#212121
}
.sidebar{
 width:290px;height:100%;background:#171717;
 display:flex;flex-direction:column;padding:10px;
 border-left:1px solid #303030;z-index:100;transition:.25s
}
.sidebar-head{display:flex;gap:7px;align-items:center;margin-bottom:10px}
.icon-btn{
 width:42px;height:42px;border:0;border-radius:12px;
 background:transparent;color:#eee;font-size:20px
}
.icon-btn:hover{background:#2b2b2b}
.brand{font-weight:700;font-size:16px;flex:1;padding-right:5px}
.new-chat{
 width:100%;height:46px;border:1px solid #3b3b3b;
 border-radius:13px;background:#212121;color:#fff;
 display:flex;align-items:center;gap:10px;padding:0 13px
}
.sidebar-scroll{flex:1;overflow:auto;padding-top:12px}
.side-section-title{font-size:12px;color:#999;padding:12px 10px 6px}
.side-row{
 width:100%;border:0;background:transparent;color:#eee;
 padding:11px 10px;border-radius:11px;text-align:right;
 display:flex;align-items:center;gap:11px;font-size:14px
}
.side-row:hover{background:#2b2b2b}
.side-row .ico{width:23px;text-align:center;font-size:17px}
.history-item{
 padding:10px;border-radius:10px;color:#ddd;font-size:13px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.history-item:hover{background:#292929}
.sidebar-bottom{border-top:1px solid #303030;padding-top:7px}
.profile{display:flex;align-items:center;gap:10px;padding:9px;border-radius:11px}
.avatar-user{
 width:32px;height:32px;border-radius:50%;
 background:linear-gradient(135deg,#198754,#0c4d32);
 display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:bold
}
.profile-text{font-size:13px;flex:1}
.plan{font-size:11px;color:#999;margin-top:2px}

.main{
 flex:1;min-width:0;height:100%;display:flex;
 flex-direction:column;position:relative
}
.topbar{
 height:58px;min-height:58px;display:flex;align-items:center;
 gap:5px;padding:0 12px;border-bottom:1px solid #ffffff08
}
.top-title{font-weight:600;font-size:15px;flex:1;text-align:center}
.top-actions{display:flex;gap:3px}

.chat{
 flex:1;overflow:auto;padding:15px 14px 145px;scroll-behavior:smooth
}
.chat-inner{max-width:850px;margin:auto}
.empty{
 min-height:58vh;display:flex;align-items:center;
 justify-content:center;color:#ddd;font-size:21px;
 text-align:center;font-weight:500
}
.message{
 display:flex;gap:12px;margin:24px 0;line-height:1.8;
 font-size:15px;animation:messageIn .2s ease
}
@keyframes messageIn{
 from{opacity:0;transform:translateY(7px)}
 to{opacity:1;transform:translateY(0)}
}
.message .avatar{
 width:34px;height:34px;min-width:34px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:11px
}
.user .avatar{background:#4b4b4b}
.assistant .avatar{background:#fff;color:#111}
.text{flex:1;white-space:pre-wrap;word-break:break-word}
.message-actions{display:flex;gap:2px;margin-top:5px}
.message-actions button{
 background:transparent;color:#999;border:0;border-radius:7px;padding:5px 7px
}
.message-actions button:hover{background:#303030;color:#fff}

.typing{
 display:flex;gap:5px;align-items:center;color:#999;padding:8px 0
}
.typing i{
 width:6px;height:6px;background:#aaa;border-radius:50%;
 animation:blink 1s infinite
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.bottom{
 position:fixed;left:0;right:0;bottom:0;padding:28px 14px 16px;
 background:linear-gradient(transparent,#212121 32%);z-index:20
}
.composer-wrap{max-width:850px;margin:auto}
.composer{
 border:1px solid #454545;border-radius:27px;background:#2f2f2f;
 box-shadow:0 5px 20px #0004;padding:7px;
 display:flex;align-items:flex-end;gap:3px
}
textarea{
 flex:1;border:0;outline:0;resize:none;color:#fff;
 background:transparent;padding:9px 8px;min-height:43px;
 max-height:140px;line-height:1.5
}
textarea::placeholder{color:#aaa}
.action{
 width:40px;height:40px;border:0;border-radius:50%;
 background:transparent;color:#ddd;font-size:20px
}
.action:hover{background:#454545}
.send{background:#fff;color:#111}
.voice-active{background:#1d8f61!important;color:#fff!important}
.composer-tools{
 display:flex;justify-content:space-between;padding:7px 8px 0;
 color:#777;font-size:10px
}

.popup{
 position:fixed;background:#2b2b2b;border:1px solid #454545;
 border-radius:15px;box-shadow:0 12px 35px #0006;padding:7px;
 display:none;z-index:200
}
.popup.show{display:block}
.add-menu{bottom:92px;right:calc(50% - 425px);width:270px}
.menu-item{
 width:100%;border:0;background:transparent;color:#fff;
 padding:11px;border-radius:10px;text-align:right;
 display:flex;align-items:center;gap:10px
}
.menu-item:hover{background:#3a3a3a}

.panel{
 position:absolute;inset:58px 0 0;background:#212121;
 overflow:auto;display:none;z-index:50
}
.panel.active{display:block}
.panel-inner{max-width:900px;margin:auto;padding:25px 18px 100px}
.back{
 border:0;background:#303030;color:#fff;padding:9px 14px;border-radius:10px
}
.panel h1{font-size:27px;margin:25px 0 18px}
.card{
 border:1px solid #3d3d3d;border-radius:17px;padding:18px;
 margin:12px 0;background:#292929
}
.card textarea{
 width:100%;height:120px;border:1px solid #484848;
 border-radius:12px;background:#212121
}
.primary{
 border:0;border-radius:11px;padding:11px 16px;
 background:#fff;color:#111;font-weight:bold
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.feature{min-height:120px}
.badge{
 display:inline-block;font-size:11px;padding:5px 9px;
 border-radius:20px;background:#3a3a3a;color:#bbb
}
.image-result{margin-top:15px}
.image-result img{
 width:100%;max-height:600px;object-fit:contain;
 border-radius:15px;display:block;background:#111
}
.file-chip{
 display:inline-flex;align-items:center;gap:7px;
 background:#393939;padding:8px 11px;border-radius:12px;
 margin-bottom:8px;color:#ddd;font-size:12px
}

@media(max-width:700px){
 .sidebar{
  position:fixed;right:-300px;top:0;bottom:0;
  box-shadow:-10px 0 30px #0008
 }
 .sidebar.open{right:0}
 .top-title{font-size:14px}
 .bottom{padding:25px 8px 10px}
 .chat{padding-left:8px;padding-right:8px}
 .grid{grid-template-columns:1fr}
 .add-menu{right:8px;left:8px;width:auto}
 .panel-inner{padding:20px 12px 90px}
}
</style>
</head>

<body>

<div class="login-screen" id="loginScreen">
 <div class="login-box">
  <div class="logo"></div>
  <h1>ومنظومة بلا حدود</h1>
  <p>مساعد ذكاء اصطناعي متكامل</p>
  <div class="login-card">
   <label>البريد الإلكتروني</label>
   <input id="emailInput" type="email" placeholder="example@email.com">
   <label>كلمة المرور</label>
   <input id="passwordInput" type="password" placeholder="كلمة المرور">
   <button class="login-btn" onclick="login()">تسجيل الدخول</button>
   <div class="login-note">سيتم استبدال الدخول التجريبي بالمصادقة الحقيقية عند ربط نظام الحسابات.</div>
  </div>
 </div>
</div>

<div class="app hidden" id="app">

<aside class="sidebar" id="sidebar">
 <div class="sidebar-head">
  <button class="icon-btn" onclick="toggleSidebar()">☰</button>
  <div class="brand">ومنظومة بلا حدود</div>
 </div>

 <button class="new-chat" onclick="newChat()">
  <span>＋</span><span>محادثة جديدة</span>
 </button>

 <div class="sidebar-scroll">
  <div class="side-section-title">القائمة</div>

  <button class="side-row" onclick="showPanel('images')">
   <span class="ico">🎨</span>تصميم الصور
  </button>

  <button class="side-row" onclick="showPanel('settings')">
   <span class="ico">⚙️
