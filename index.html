<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الذكاء الاصطناعي الخاص بي</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f5f7;
      color: #222;
    }

    .app {
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #222;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 8px 0 0;
      opacity: .8;
    }

    .chat {
      flex: 1;
      padding: 20px;
    }

    .welcome {
      background: #f0f2f4;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      line-height: 1.8;
    }

    .message {
      margin: 12px 0;
      padding: 14px;
      border-radius: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .user {
      background: #222;
      color: white;
      margin-right: 30px;
    }

    .ai {
      background: #eef1f3;
      margin-left: 30px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 52px;
      border: 1px solid #ccc;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 90px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.97);
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 تطبيق الذكاء الاصطناعي الخاص بي</h1>
      <p>اسألني وسأساعدك</p>
    </header>

    <main class="chat" id="chat">
      <div class="welcome">
        👋 مرحبًا بك!
        <br>
        اكتب سؤالك في الأسفل للبدء.
      </div>
    </main>

    <div class="input-area">
      <textarea id="question" placeholder="اكتب سؤالك هنا..."></textarea>
      <button onclick="sendQuestion()">إرسال</button>
    </div>

  </div>

  <script>
    function sendQuestion() {
      const input = document.getElementById("question");
      const chat = document.getElementById("chat");
      const question = input.value.trim();

      if (!question) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = question;
      chat.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent =
        "هذه نسخة أولية من التطبيق. تم استلام سؤالك بنجاح، وسنربطها بالذكاء الاصطناعي الحقيقي في الخطوة التالية.";
      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("question").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuestion();
      }
    });
  </script>

</body>
  </html>
